<!-- ─── MOBILE MENU SCRIPT ─────────────────────────────────── -->
<script>
(function(){
  var btn = document.getElementById('csvn-menu-btn');
  var menu = document.getElementById('csvn-mobile-menu');
  if (btn && menu) {
    btn.addEventListener('click', function(){
      menu.classList.toggle('hidden');
    });
  }
})();
</script>
