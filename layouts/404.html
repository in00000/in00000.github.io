{{ define "main" }}
<section class="min-h-[75vh] flex items-center justify-center px-4 py-20 bg-slate-50">
  <div class="max-w-2xl w-full text-center">

    <!-- Big 404 -->
    <div class="mb-4">
      <span class="block text-7xl md:text-9xl font-black text-indigo-600 leading-none">404</span>
    </div>

    <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-3">
      Page Not Found
    </h1>

    <p class="text-slate-600 mb-8 max-w-lg mx-auto">
      The page you're looking for doesn't exist, has been moved, or the vendor listing may have been removed.
    </p>

    <!-- Primary actions -->
    <div class="flex flex-wrap gap-3 justify-center mb-10">
      <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
      <a href="/listings/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg border border-slate-300 hover:border-indigo-600 hover:text-indigo-600 text-slate-700 font-semibold transition">
        <i class="fa-solid fa-building"></i> Browse Vendors
      </a>
      <a href="/categories/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg border border-slate-300 hover:border-indigo-600 hover:text-indigo-600 text-slate-700 font-semibold transition">
        <i class="fa-solid fa-layer-group"></i> All Categories
      </a>
    </div>

    <!-- Search -->
    <form action="/search/" method="get" class="max-w-md mx-auto mb-10">
      <div class="relative">
        <input
          type="text"
          name="q"
          placeholder="Search vendors or categories…"
          class="w-full pl-11 pr-4 py-3 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800"
          aria-label="Search CSVN" />
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div>
    </form>

    <!-- Quick links -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-xl mx-auto text-sm">
      <a href="/pricing/" class="px-3 py-3 rounded-lg bg-white border border-slate-200 hover:border-indigo-600 hover:text-indigo-600 text-slate-700 font-medium transition">
        <i class="fa-solid fa-tag mr-1.5"></i>Pricing
      </a>
      <a href="/list-your-business/" class="px-3 py-3 rounded-lg bg-white border border-slate-200 hover:border-indigo-600 hover:text-indigo-600 text-slate-700 font-medium transition">
        <i class="fa-solid fa-plus mr-1.5"></i>List Business
      </a>
      <a href="/about/" class="px-3 py-3 rounded-lg bg-white border border-slate-200 hover:border-indigo-600 hover:text-indigo-600 text-slate-700 font-medium transition">
        <i class="fa-solid fa-circle-info mr-1.5"></i>About
      </a>
      <a href="/contact/" class="px-3 py-3 rounded-lg bg-white border border-slate-200 hover:border-indigo-600 hover:text-indigo-600 text-slate-700 font-medium transition">
        <i class="fa-solid fa-envelope mr-1.5"></i>Contact
      </a>
    </div>

    <!-- Contact line -->
    <p class="mt-10 text-sm text-slate-500">
      Still stuck? WhatsApp
      <a href="https://wa.me/918793932827" class="text-indigo-600 hover:underline font-medium">+91 87939 32827</a>
      or email
      <a href="mailto:info@csvn.in" class="text-indigo-600 hover:underline font-medium">info@csvn.in</a>
    </p>

  </div>
</section>
{{ end }}
