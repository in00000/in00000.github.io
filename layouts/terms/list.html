{{ define "main" }}

<section class="bg-gradient-to-br from-[#1e1b4b] via-indigo-700 to-[#4f46e5] text-white pt-24 pb-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center">

    <nav class="text-xs text-indigo-200 mb-5 flex items-center justify-center gap-2">
      <a href="/" class="hover:text-white transition-colors">Home</a>
      <span class="text-indigo-300/50">›</span>
      <span class="text-white font-semibold">{{ .Title }}</span>
    </nav>

    <h1 class="text-3xl sm:text-5xl font-black tracking-tight leading-tight mb-4">
      {{ .Title }}
    </h1>

    {{ with .Description }}
    <p class="text-indigo-100/85 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed">
      {{ . }}
    </p>
    {{ end }}

  </div>
</section>

<section class="py-12 sm:py-16 bg-white">
  <div class="max-w-3xl mx-auto px-4 sm:px-6">

    {{ if .Content }}
      <div class="csvn-page-content">
        {{ .Content }}
      </div>
    {{ else }}
      <p class="text-slate-500 text-center italic py-10">
        Content coming soon.
      </p>
    {{ end }}

  </div>
</section>

<style>
  .csvn-page-content {
    font-size: 1rem;
    line-height: 1.75;
    color: #334155;
  }
  .csvn-page-content h2 {
    font-size: 1.5rem;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.02em;
    margin: 2rem 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #eef2ff;
  }
  .csvn-page-content h3 {
    font-size: 1.15rem;
    font-weight: 800;
    color: #0f172a;
    margin: 1.5rem 0 0.75rem;
  }
  .csvn-page-content p {
    margin-bottom: 1.1rem;
  }
  .csvn-page-content a {
    color: #4f46e5;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .csvn-page-content a:hover {
    color: #059669;
  }
  .csvn-page-content strong {
    color: #0f172a;
    font-weight: 700;
  }
  .csvn-page-content ul {
    margin: 1rem 0 1.5rem;
    padding-left: 0;
    list-style: none;
  }
  .csvn-page-content ul li {
    position: relative;
    padding-left: 1.75rem;
    margin-bottom: 0.5rem;
  }
  .csvn-page-content ul li::before {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    color: #10b981;
    position: absolute;
    left: 0;
    top: 0.25rem;
    font-size: 0.75rem;
  }
</style>

{{ end }}
