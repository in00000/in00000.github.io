# ─────────────────────────────────────────────────────────────
#  CSVN — Corporate Services Vendor Network
#  File: hugo.toml  (project root)
# ─────────────────────────────────────────────────────────────

baseURL      = "https://www.csvn.in/"
languageCode = "en-us"
title        = "CSVN India — Corporate Services Vendor Network | B2B Vendor Directory"
timeZone     = "Asia/Kolkata"

disableKinds = ["RSS", "term"]

# ─── Pagination ──────────────────────────────────────────────
[pagination]
  pagerSize = 24

# ─── Sitemap ─────────────────────────────────────────────────
[sitemap]
  changefreq = "weekly"
  priority   = 0.5
  filename   = "sitemap.xml"

# ─── Site-wide parameters ────────────────────────────────────
[params]
  description    = "CSVN — a B2B service provider directory helping corporate service vendors build visibility and reach decision-makers across India."
  reportEmail    = "info@csvn.in"
  phone          = "+91 87939 32827"
  whatsapp       = "918793932827"
  youtubeChannel = "https://www.youtube.com/@CSVNIndia"

  heroTitle    = "Get Discovered by India's Decision-Makers"
  heroSubtitle = "CSVN is a B2B visibility platform that helps corporate service providers reach Purchase Heads, Procurement Heads, HR Heads, Admin Heads, and other decision-makers across India."

  hubs = [
    "Pune & Chakan",
    "Mumbai & Thane",
    "Bangalore Industrial",
    "Chennai Oragadam",
    "NCR / Gurgaon"
  ]

  videosHeading    = "See CSVN in Action"
  videosSubheading = "Four short films on how corporate vendors across India are getting discovered."

  [[params.videos]]
    id    = "zulp4R2T8P0"
    title = "Why Great B2B Vendors Stay Invisible in India"
    tag   = "Problem → Solution"

  [[params.videos]]
    id    = "mWfHyMC3zx4"
    title = "10 Reasons Vendors Are Joining CSVN"
    tag   = "Why Choose CSVN"

  [[params.videos]]
    id    = "lihHqNDvyIk"
    title = "Every Question About CSVN — Answered Honestly"
    tag   = "Real Questions"

  [[params.videos]]
    id    = "nZKf0asgBEU"
    title = "From Invisible to Found — One Vendor's Year"
    tag   = "Vendor Journey"

# ─── Markup ──────────────────────────────────────────────────
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ─── Build ───────────────────────────────────────────────────
[build]
  writeStats = true

# ─── Outputs ─────────────────────────────────────────────────
[outputs]
  home = ["HTML", "Sitemap"]
